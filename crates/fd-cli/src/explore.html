<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fd explore</title>
<style>
  :root { --bg: #000; --panel: rgba(20, 18, 16, 0.82); --ink: #eee8de; --dim: #a59c8e; --accent: #e0b070; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 13px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: grab; image-rendering: pixelated; }
  canvas.drag { cursor: grabbing; }
  #hud { position: fixed; left: 12px; top: 12px; padding: 8px 10px; background: var(--panel); border-radius: 6px;
    pointer-events: none; white-space: pre; }
  #hud b { color: var(--accent); font-weight: normal; }
  #presets { position: fixed; right: 12px; top: 12px; width: 230px; padding: 6px; background: var(--panel); border-radius: 6px; }
  #presets button { display: flex; justify-content: space-between; width: 100%; margin: 2px 0; padding: 5px 8px; border: 0;
    border-radius: 4px; background: transparent; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  #presets button:hover { background: rgba(255, 255, 255, 0.1); }
  #presets button span { color: var(--dim); }
  #help { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; background: var(--panel); border-radius: 6px; color: var(--dim); }
  #look { position: fixed; right: 12px; bottom: 12px; width: 240px; padding: 8px 10px; background: var(--panel); border-radius: 6px; }
  #look label { display: flex; justify-content: space-between; align-items: center; margin: 3px 0; color: var(--dim); gap: 8px; }
  #look input[type=range] { width: 120px; accent-color: var(--accent); }
  #look select { background: #222; color: var(--ink); border: 0; font: inherit; }
  #look .title { color: var(--accent); margin-bottom: 4px; }
  #err { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 6px 10px; background: #5a1d1d; border-radius: 6px; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="presets"></div>
<div id="help">wheel: zoom at cursor · drag: pan · 1-9, 0: presets · space: pause flow · R: reset look · H: hide panels</div>
<div id="look">
  <div class="title">look (live, no re-render)</div>
  <label>palette <select id="pal"></select></label>
  <label>bands <input id="bands" type="range" min="-2.3" max="3.3" step="0.01"></label>
  <label>flow <input id="flow" type="range" min="-1.5" max="1.5" step="0.01"></label>
  <label>breathe <input id="breathe" type="range" min="0" max="0.6" step="0.01"></label>
  <label>breathe rate <input id="brate" type="range" min="0.02" max="1" step="0.01"></label>
  <label>hue drift <input id="drift" type="range" min="-0.3" max="0.3" step="0.005"></label>
  <label>relief <input id="relief" type="range" min="0" max="1" step="0.01"></label>
  <label>edge dark <input id="edge" type="range" min="0" max="1" step="0.01"></label>
  <label>edge glow <input id="glow" type="range" min="0" max="1.5" step="0.01"></label>
</div>
<div id="err"></div>
<script>
"use strict";
// Exact centre: BigInt decimal fixed point with D fraction digits, so panning stays exact
// at any depth. Width: log10 of the horizontal extent (a float is plenty for a zoom level).
const V0_RE = "-0.7432918908524302029316241585089040394625440130877230883413356446722846985935655895273743988748934502";
const V0_IM = "0.1312405523087976047708458738159648480193742492666251343726688732491323053181613282916110110463622922";
const VAL_RE = "-0.743643887037158704752191506114774", VAL_IM = "0.131825904205311970493132056385139";
const PRESETS = [
  { name: "Whole set", re: "-0.65", im: "0", w: "4.2", iter: 2000 },
  { name: "Seahorse valley", re: "-0.7453", im: "0.1127", w: "0.0065", iter: 5000 },
  { name: "Elephant valley", re: "0.2855", im: "0.0115", w: "0.012", iter: 20000 },
  { name: "Antenna minibrot", re: "-1.7548776662466927", im: "0", w: "0.06", iter: 5000 },
  { name: "Misiurewicz spiral", re: V0_RE, im: V0_IM, w: "4e-5", iter: 20000 },
  { name: "Deep valley", re: VAL_RE, im: VAL_IM, w: "3e-12", iter: 20000 },
  { name: "Spiral M(24,2)", re: V0_RE, im: V0_IM, w: "1e-24", iter: 50000 },
  { name: "Deeper valley", re: VAL_RE, im: VAL_IM, w: "1e-28", iter: 50000 },
  { name: "Period-764 minibrot", re: V0_RE, im: V0_IM, w: "1e-48", iter: 100000 },
  { name: "c = i, 1e-1000", re: "0", im: "1", w: "1e-1000", iter: 20000 },
];
// Coarse to fine. Levels with s <= 2 render in row strips so a new view never waits
// long behind an old one.
const LEVELS = [{ s: 8, ss: 1 }, { s: 4, ss: 1 }, { s: 2, ss: 1 }, { s: 1, ss: 1 }, { s: 1, ss: 2 }];

// EXPL-03: the server sends raw shading inputs (ln nu, relief light, edge, escaped share)
// and the page colours them every frame, so bands can flow and breathe without rendering.
const PALETTES = {   // cosine palettes a + b cos(2 pi (c t + d))
  "gold & blue": [[0.55, 0.5, 0.5], [0.45, 0.45, 0.5], [1, 1, 1], [0.0, 0.15, 0.35]],
  "psychedelic": [[0.5, 0.5, 0.5], [0.5, 0.5, 0.5], [1, 1, 1], [0.0, 0.33, 0.67]],
  "fire": [[0.5, 0.3, 0.15], [0.5, 0.35, 0.2], [1, 1, 1], [0.0, 0.1, 0.2]],
  "ice": [[0.35, 0.5, 0.65], [0.3, 0.35, 0.35], [1, 1, 1], [0.5, 0.55, 0.6]],
  "umber": [[0.22, 0.13, 0.06], [0.18, 0.11, 0.05], [1, 1, 1], [0.0, 0.02, 0.05]],
  "neon": [[0.5, 0.5, 0.5], [0.5, 0.5, 0.5], [2, 1, 0], [0.5, 0.2, 0.25]],
  "mono": [[0.5, 0.5, 0.5], [0.5, 0.5, 0.5], [1, 1, 1], [0, 0, 0]],
};
const LOOK0 = { pal: "gold & blue", bands: 0.7, flow: 0.25, breathe: 0, brate: 0.15, drift: 0, relief: 0.6, edge: 0.5, glow: 0 };
const KNOBS = ["bands", "flow", "breathe", "brate", "drift", "relief", "edge", "glow"];
const look = { ...LOOK0 };
let paused = false, phase = 0, hue = 0, clock = 0, lastT = performance.now();
let raw = null, rawSnap = null;            // W x H x 4 floats: the best image so far
let shaded = null, shadedSnap = null, shadeImg = null, shadeDirty = true;
let lastShade = -Infinity;
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const hud = document.getElementById("hud"), errBox = document.getElementById("err");
let W = 0, H = 0;
let view = null, baseIter = 2000;
let gen = 0, job = null, inflight = false, dirty = false;
let secPerSample = 1e-6, last = { info: {}, level: 0 };

function log10Dec(s) {
  const m = /^\s*([0-9.]+)(?:[eE]([-+]?\d+))?\s*$/.exec(s);
  return Math.log10(parseFloat(m[1])) + (m[2] ? parseInt(m[2], 10) : 0);
}
function parseDec(s, D) {
  s = s.trim();
  const neg = s.startsWith("-");
  if (neg || s.startsWith("+")) s = s.slice(1);
  const [i, f = ""] = s.split(".");
  const v = BigInt((i || "0") + (f + "0".repeat(D)).slice(0, D));
  return neg ? -v : v;
}
function toDec(v, D) {
  const neg = v < 0n;
  let t = (neg ? -v : v).toString().padStart(D + 1, "0");
  let i = t.slice(0, t.length - D), f = t.slice(t.length - D).replace(/0+$/, "");
  return (neg ? "-" : "") + i + (f ? "." + f : "");
}
function needDigits(l10w) { return Math.max(20, Math.ceil(-l10w) + 20); }
function widthStr(l10w) {
  const e = Math.floor(l10w);
  return (10 ** (l10w - e)).toFixed(9) + "e" + e;
}
function rescale(v, from, to) { return to > from ? v * 10n ** BigInt(to - from) : v; }
function snapshot(v) { return { re: v.re, im: v.im, D: v.D, l10w: v.l10w }; }

// The BigInt step for `px` pixels of a W-wide view: px / W * 10^l10w, in units of 10^-D.
function pxToBig(px, v) {
  const x = v.l10w + v.D, e = Math.floor(x);
  const m = (px / W) * 10 ** (x - e);
  return BigInt(Math.round(m * 1e12)) * 10n ** BigInt(e - 12);
}
// A BigInt difference (units 10^-D) in pixels of a view with log width l10w.
function bigToPx(d, D, l10w) {
  if (d === 0n) return 0;
  const neg = d < 0n, a = neg ? -d : d, drop = Math.max(0, a.toString().length - 20);
  const n = Number(a / 10n ** BigInt(drop)) * 10 ** (drop - D - l10w) * W;
  return neg ? -n : n;
}
function shift(v, dx, dy) {
  v.re += pxToBig(dx, v);
  v.im -= pxToBig(dy, v);   // screen y points down, imaginary axis up
}
function ensureDigits(v) {
  const need = needDigits(v.l10w);
  if (need > v.D) {
    v.re = rescale(v.re, v.D, need);
    v.im = rescale(v.im, v.D, need);
    v.D = need;
  }
}
function iterFor(l10w) {
  return Math.max(baseIter, Math.min(100000, Math.round(1000 + 2000 * Math.max(0, -l10w))));
}

function jump(p) {
  const l10w = log10Dec(p.w), D = needDigits(l10w);
  view = { re: parseDec(p.re, D), im: parseDec(p.im, D), D, l10w };
  baseIter = p.iter;
  raw = null; rawSnap = null; shadedSnap = null;
  changed();
}
function changed() { dirty = true; }

function resize() {
  W = Math.max(8, Math.floor(innerWidth / 8) * 8);
  H = Math.max(8, Math.floor(innerHeight / 8) * 8);
  canvas.width = W; canvas.height = H;
  raw = null; rawSnap = null; shadedSnap = null;
  if (view) changed();
}

function nextRequest(j) {
  const L = LEVELS[j.level], Wl = W / L.s, Hl = H / L.s;
  let r0 = 0, r1 = Hl;
  if (L.s <= 2) {
    const rows = Math.round(0.2 / secPerSample / (Wl * L.ss * L.ss));
    r0 = j.row; r1 = Math.min(Hl, r0 + Math.max(4, Math.min(Hl, rows)));
  }
  const v = { re: j.snap.re, im: j.snap.im, D: j.snap.D, l10w: j.snap.l10w };
  shift(v, 0, ((r0 + r1) / 2 - Hl / 2) * L.s);
  const q = new URLSearchParams({
    re: toDec(v.re, v.D), im: toDec(v.im, v.D), width: widthStr(v.l10w),
    w: Wl, h: r1 - r0, ss: L.ss, iter: iterFor(v.l10w), gen: j.gen, raw: 1,
  });
  return { url: "/render?" + q, L, Wl, Hl, r0, r1 };
}

async function kick() {
  if (inflight || !job) return;
  inflight = true;
  const j = job, req = nextRequest(j);
  try {
    const r = await fetch(req.url);
    if (r.status === 200) {
      const w = +r.headers.get("X-Width"), h = +r.headers.get("X-Height");
      const info = Object.fromEntries((r.headers.get("X-Info") || "").split(" ").map(kv => kv.split("=")));
      const rgb = new Float32Array(await r.arrayBuffer());
      secPerSample = Math.max(1e-9, +info.seconds / (w * h * req.L.ss * req.L.ss));
      if (j.level === 0 || j.gen === gen) {
        paint(j, req, rgb, w, h);
        last = { info, level: j.level + 1 };
      }
      errBox.style.display = "none";
    } else if (r.status !== 204) {
      errBox.textContent = await r.text();
      errBox.style.display = "block";
      if (j === job) job = null;
    }
  } catch (e) {
    errBox.textContent = "fd explore is not answering: " + e;
    errBox.style.display = "block";
  }
  // Advance this job; a newer job may already have replaced it.
  if (j === job) {
    j.row = req.r1;
    if (j.row >= req.Hl) { j.level++; j.row = 0; }
    if (j.level >= LEVELS.length) job = null;
  }
  inflight = false;
  kick();
}

function paint(j, req, f, w, h) {
  if (j.level === 0 || !raw) {
    // A coarse frame always becomes the new base image, even for a view the mouse
    // has since left: it is drawn transformed until a newer one lands.
    raw = new Float32Array(W * H * 4);
    rawSnap = j.snap;
  }
  const s = req.L.s, y0 = req.r0 * s;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const k = 4 * (y * w + x);
      for (let dy = 0; dy < s; dy++) {
        const row = y0 + y * s + dy;
        if (row >= H) break;
        let o = 4 * (row * W + x * s);
        for (let dx = 0; dx < s && x * s + dx < W; dx++, o += 4) {
          raw[o] = f[k]; raw[o + 1] = f[k + 1]; raw[o + 2] = f[k + 2]; raw[o + 3] = f[k + 3];
        }
      }
    }
  }
  shadeDirty = true;
}

// Colour the raw buffer with the current look and time into the `shaded` canvas.
function shade() {
  if (!raw) return;
  if (!shaded || shaded.width !== W || shaded.height !== H) {
    shaded = new OffscreenCanvas(W, H); shadeImg = new ImageData(W, H);
  }
  const [a, b, c, d] = PALETTES[look.pal];
  const k = 10 ** look.bands * (1 + look.breathe * Math.sin(2 * Math.PI * look.brate * clock));
  const T = 2 * Math.PI, rel = look.relief, ed = look.edge, gl = look.glow;
  const ca = [T * c[0], T * c[1], T * c[2]];
  const da = [T * (d[0] + phase * c[0]), T * (d[1] + phase * c[1] + 0.37 * hue), T * (d[2] + phase * c[2] + 0.71 * hue)];
  const px = shadeImg.data, n = W * H;
  for (let i = 0, o = 0; i < n; i++, o += 4) {
    const cov = raw[o + 3];
    if (cov <= 0) { px[o] = 0; px[o + 1] = 0; px[o + 2] = 0; px[o + 3] = 255; continue; }
    const t = k * raw[o], lit = raw[o + 1], edge = raw[o + 2];
    const sh = ((1 - rel) + rel * (0.15 + 0.85 * lit)) * ((1 - ed) + ed * edge);
    const g = gl * (1 - edge) ** 3;
    px[o] = 255 * cov * Math.min(1, (a[0] + b[0] * Math.cos(ca[0] * t + da[0])) * sh + g);
    px[o + 1] = 255 * cov * Math.min(1, (a[1] + b[1] * Math.cos(ca[1] * t + da[1])) * sh + 0.85 * g);
    px[o + 2] = 255 * cov * Math.min(1, (a[2] + b[2] * Math.cos(ca[2] * t + da[2])) * sh + 0.6 * g);
    px[o + 3] = 255;
  }
  shaded.getContext("2d").putImageData(shadeImg, 0, 0);
  shadedSnap = rawSnap;
}

function draw() {
  const now = performance.now(), dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  if (!paused && (look.flow !== 0 || look.breathe !== 0 || look.drift !== 0)) {
    clock += dt; phase -= look.flow * dt; hue += look.drift * dt; shadeDirty = true;
  }
  // Leave time for refinement responses and input between full-image recolours.
  if (shadeDirty && now - lastShade >= 1000 / 30) {
    shadeDirty = false; lastShade = now; shade();
  }
  if (dirty && view) {
    dirty = false;
    gen = Math.max(gen + 1, Date.now());   // stays newer than any earlier tab or reload
    job = { gen, snap: snapshot(view), level: 0, row: 0 };
    kick();
  }
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  if (shaded && shadedSnap) {
    // Where the stored image lands in the current view (display only, until replaced).
    const D = Math.max(shadedSnap.D, view.D);
    const dx = bigToPx(rescale(shadedSnap.re, shadedSnap.D, D) - rescale(view.re, view.D, D), D, view.l10w);
    const dy = -bigToPx(rescale(shadedSnap.im, shadedSnap.D, D) - rescale(view.im, view.D, D), D, view.l10w);
    const k = 10 ** (shadedSnap.l10w - view.l10w);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(shaded, W / 2 + dx - (W / 2) * k, H / 2 + dy - (H / 2) * k, W * k, H * k);
  }
  if (view) {
    const i = last.info, zoom = Math.log10(4) - view.l10w;
    hud.innerHTML =
      `width  <b>${(10 ** (view.l10w - Math.floor(view.l10w))).toFixed(2)}e${Math.floor(view.l10w)}</b>   zoom 10^${zoom.toFixed(1)}\n` +
      `iter   ${iterFor(view.l10w)}   kernel ${i.kernel || "-"}\n` +
      `level  ${job ? job.level + 1 : LEVELS.length}/${LEVELS.length}${job ? " refining" : " done"}   last ${i.seconds ? (+i.seconds).toFixed(3) + " s" : "-"}\n` +
      `unresolved ${i.unresolved ? (100 * i.unresolved).toFixed(3) + "%" : "-"}`;
  }
  requestAnimationFrame(draw);
}

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  if (!view) return;
  const px = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
  let delta = Math.max(-0.5, Math.min(0.5, px * 0.0012));          // decades
  delta = Math.min(delta, Math.log10(8) - view.l10w);
  const r = canvas.getBoundingClientRect();
  const cx = (e.clientX - r.left) * W / r.width, cy = (e.clientY - r.top) * H / r.height;
  const f = 1 - 10 ** delta;   // keep the point under the cursor fixed
  shift(view, (cx - W / 2) * f, (cy - H / 2) * f);
  view.l10w += delta;
  ensureDigits(view);
  changed();
}, { passive: false });

let drag = null;
canvas.addEventListener("pointerdown", e => {
  drag = { x: e.clientX, y: e.clientY };
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add("drag");
});
canvas.addEventListener("pointermove", e => {
  if (!drag || !view) return;
  const r = canvas.getBoundingClientRect();
  shift(view, -(e.clientX - drag.x) * W / r.width, -(e.clientY - drag.y) * H / r.height);
  drag = { x: e.clientX, y: e.clientY };
  changed();
});
canvas.addEventListener("pointerup", () => { drag = null; canvas.classList.remove("drag"); });

const list = document.getElementById("presets");
PRESETS.forEach((p, n) => {
  const b = document.createElement("button");
  b.innerHTML = `${(n + 1) % 10}  ${p.name} <span>${p.w}</span>`;
  b.onclick = () => jump(p);
  list.appendChild(b);
});
const sel = document.getElementById("pal");
Object.keys(PALETTES).forEach(n => { const o = document.createElement("option"); o.value = o.textContent = n; sel.appendChild(o); });
function syncControls() {
  sel.value = look.pal;
  for (const id of KNOBS) document.getElementById(id).value = look[id];
}
sel.onchange = () => { look.pal = sel.value; shadeDirty = true; sel.blur(); };
for (const id of KNOBS) document.getElementById(id).oninput = e => { look[id] = +e.target.value; shadeDirty = true; };
syncControls();
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  const n = "1234567890".indexOf(e.key);
  if (n >= 0) jump(PRESETS[n]);
  if (e.key === " ") { paused = !paused; e.preventDefault(); }
  if (e.key === "r" || e.key === "R") { Object.assign(look, LOOK0); phase = 0; hue = 0; clock = 0; syncControls(); shadeDirty = true; }
  if (e.key === "h" || e.key === "H") for (const id of ["hud", "presets", "help", "look"]) {
    const el = document.getElementById(id); el.style.display = el.style.display === "none" ? "" : "none";
  }
});
addEventListener("resize", resize);
resize();
jump(PRESETS[0]);
requestAnimationFrame(draw);
</script>
</body>
</html>
