[package]
name = "fd-cli"
description = "fd: render samples, shade samples"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fd"
path = "src/main.rs"

[dependencies]
fd-addr = { path = "../fd-addr" }
fd-atlas = { path = "../fd-atlas" }
fd-fixed = { path = "../fd-fixed" }
fd-samples = { path = "../fd-samples" }
fd-kernel = { path = "../fd-kernel" }
fd-shade = { path = "../fd-shade" }

pollster = "0.4"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "dx12", "static-dxc", "wgsl"] }

[dev-dependencies]
naga = { version = "=30.0.0", features = ["wgsl-in"] }
