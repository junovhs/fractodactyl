[package]
name = "fd-cli"
description = "fd: render samples, shade samples"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fd"
path = "src/main.rs"

[dependencies]
fd-addr = { path = "../fd-addr" }
fd-atlas = { path = "../fd-atlas" }
fd-fixed = { path = "../fd-fixed" }
fd-samples = { path = "../fd-samples" }
fd-kernel = { path = "../fd-kernel" }
fd-shade = { path = "../fd-shade" }

ash = "0.38"
gpu-allocator = { version = "0.28", default-features = false, features = ["std", "vulkan"] }
pollster = "0.4"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }

[dev-dependencies]
naga = { version = "=30.0.0", features = ["wgsl-in"] }

[build-dependencies]
shaderc = "0.10"
