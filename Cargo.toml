[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# GPU stages run on wgpu (WGSL, compiled at run time); the CPU kernel is std-only.
[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"

[profile.dev]
opt-level = 1
