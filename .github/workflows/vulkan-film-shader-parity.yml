name: Vulkan film shader parity
# Manual: the wgpu studio passes (f32 only, no float64 needed) against the frozen CPU
# studio output on lavapipe with the Khronos validation layer, failing on any
# validation message. The ci workflow runs the same tests on every push without the
# layer.
on:
  workflow_dispatch:
jobs:
  film-shader-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Install Mesa Vulkan and validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-validationlayers
      - name: Compare Vulkan palette edges against CPU
        run: |
          set -euo pipefail
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name '*lvp*' | head -n1)"
          test -f "$VK_ICD_FILENAMES"
          export VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
          export FD_REQUIRE_GPU=1
          sudo apt-get install -y -qq ffmpeg
          cargo test -p fd-cli -p fd-shade -- wgsl_ gpu_ frozen --nocapture 2>&1 | tee /tmp/film-shader-parity.log
          grep -q 'test result: ok.' /tmp/film-shader-parity.log
          ! grep -Eq 'skipped|Validation Error|VUID-' /tmp/film-shader-parity.log
