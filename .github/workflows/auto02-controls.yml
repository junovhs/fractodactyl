name: auto02-controls
on:
  push:
    branches: [gpt/AUTO-02]
    paths: [.github/workflows/auto02-controls.yml]

jobs:
  positive-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy mpmath gmpy2
      - name: Workspace, native and corpus regression
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo clippy --manifest-path tools/research/misiurewicz/auto_cycle_bench/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/research/misiurewicz/auto_cycle_bench/Cargo.toml
          python -m unittest discover -s tools/research/misiurewicz -p test_auto_corpus.py
      - name: Build fd and frozen native
        run: |
          cargo build --release -p fd-cli
          cargo build --release --manifest-path tools/research/misiurewicz/auto_cycle_bench/Cargo.toml
      - name: AUTO-01 controls reach real jump and full-frame + mpmath scoring
        run: |
          python tools/research/misiurewicz/auto_corpus.py \
            --subset --corpus tools/research/misiurewicz/auto02_controls.txt \
            --fd target/release/fd \
            --native tools/research/misiurewicz/auto_cycle_bench/target/release/native-cycles \
            --size 1920x1080 --iter 20000 --threads 4 --out out/auto02-controls
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("out/auto02-controls/report.json").read_text())
          assert len(report["results"])==3
          for row in report["results"]:
              assert row["decision"]=="accelerate", row["name"]
              assert row["jumps"]>0, row["name"]
              assert row["correctness"]=="pass", row["name"]
              assert len(row["oracle"])>0, row["name"]
              assert row["fd_compare"]["class_mismatches"]==0, row["name"]
          print("All positive controls: jump, every-pixel compare and direct oracle PASS.")
          PY
      - name: Results table
        if: always()
        run: |
          if test -f out/auto02-controls/summary.md; then
            cat out/auto02-controls/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auto02-positive-controls
          path: |
            out/auto02-controls/summary.md
            out/auto02-controls/report.json
            out/auto02-controls/*/report.json
            out/auto02-controls/*/compiler.log
