name: gpu-route-build
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/gpu-route-build.yml'
permissions:
  contents: read
jobs:
  # DEC-27: prove the probe's Windows/Linux host prerequisites before GPU-12.
  # CPU-only evidence: hosted adapters are never used for parity or timings.
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      # Frozen with the CPU zone it captures from (CLEA-04): the probe builds only at the
      # last commit that has it (tools/research/gpu-route/README.md).
      - uses: actions/checkout@v4
        with:
          ref: b76035fff72ae41c27ae617d28d3f970fa9a35af
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Put generated files outside checkout
        run: |
          "CARGO_TARGET_DIR=$(Join-Path $env:RUNNER_TEMP 'gpu-route-build')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FD_GPU_ROUTE_CACHE=$(Join-Path $env:RUNNER_TEMP 'gpu-route-inputs')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Format standalone probe
        run: cargo fmt --manifest-path tools/research/gpu-route/Cargo.toml --all --check
      - name: Build all source arms
        run: cargo build --locked --manifest-path tools/research/gpu-route/Cargo.toml --jobs 1
      - name: CPU tests
        run: cargo test --locked --manifest-path tools/research/gpu-route/Cargo.toml --jobs 1 -- --test-threads=1
      - name: Capture identical-checkpoint preview (no GPU)
        run: cargo run --locked --manifest-path tools/research/gpu-route/Cargo.toml --jobs 1 -- capture-grid 1e-40 64 36
