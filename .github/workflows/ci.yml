name: ci
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - name: clippy + tests
        run: JOBS=4 bash scripts/check.sh

  locations:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpmath gmpy2
      - run: cargo build --release -j 4
      - name: render known locations, compare runs, check oracle
        run: THREADS=4 bash scripts/locations.sh target/release/fd out/locations
      - name: benchmark report (shallow f64 + deep scaled), every metric populated
        run: THREADS=4 bash scripts/bench.sh target/release/fd out/bench seahorse i-1e-300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-results
          path: |
            out/locations/oracle.jsonl
            out/bench/bench.jsonl
