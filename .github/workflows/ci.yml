name: ci
on:
  push:
    branches: ["**"]
    # Pushes touching only research probes, docs or the manual bench workflows skip CI:
    # none of these paths is built or read by the checks below (tools/oracle.py is).
    paths-ignore:
      - "docs/**"
      - "tools/research/**"
      - ".github/workflows/*-bench.yml"
      - "*.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - name: clippy + tests
        run: JOBS=4 bash scripts/check.sh

  locations:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpmath gmpy2
      - run: cargo build --release -j 4
      - name: render known locations, compare runs, check oracle
        run: THREADS=4 bash scripts/locations.sh target/release/fd out/locations
      - name: benchmark report (shallow f64 + deep scaled), every metric populated
        run: THREADS=4 bash scripts/bench.sh target/release/fd out/bench seahorse i-1e-300
      - name: progressive refinement savings (LOD-02), vs full render iterations
        run: |
          mkdir -p out/refine
          for v in "-0.7453 0.1127 0.0065 seahorse" "-0.75 0 3 whole"; do
            read -r re im w name <<< "$v"
            for k in auto fx; do
              args=(--re "$re" --im "$im" --width "$w" --iter 20000 --size 192x108 --ss 3 --kernel "$k" --columns nu,de,bound --threads 4)
              echo "== $name $k"
              target/release/fd render "${args[@]}" --refine 8 -o "out/refine/$name-$k.fds" | grep -v '^block '
              target/release/fd bench "${args[@]}" --runs 1 | grep -o '"iterations":{[^}]*}'
            done
          done
      - name: multi-frame reference reuse (REF-02) along a known path
        run: |
          for k in auto fx; do
            echo "== valley path, kernel $k"
            target/release/fd reuse bench/path-valley.txt --store "out/reuse-$k" --size 128x72 --iter 50000 --columns nu,de --kernel "$k" --threads 4
          done
      - name: deadline scheduler (SCHE-02) along the valley path, least slack vs EDF and first-use
        run: |
          set -euo pipefail
          args=(bench/path-valley.txt --size 128x72 --iter 50000 --columns nu,de --fps 30 --workers 2)
          echo "== playback starts with the compile (lead 0): report only, prints the minimum lead"
          target/release/fd schedule "${args[@]}" --store out/schedule/live --on-miss report
          echo "== compiled ahead (DEC-02), lead 2 s: every chunk must be ready before its first-use frame"
          target/release/fd schedule "${args[@]}" --store out/schedule/ahead --lead 2
      - name: Atlas v0 compiler (VIDE-01), the committed path regenerated, a 25-frame cut compiled and walked
        run: |
          set -euo pipefail
          fd=target/release/fd; mkdir -p out/compile
          eval "gen=($(sed -n 's/^# fd path zoom //p' bench/path-atlas-v0.txt))"
          diff <(grep -v '^#' bench/path-atlas-v0.txt) <($fd path zoom "${gen[@]}" | grep -v '^#')
          grep -v '^#' bench/path-atlas-v0.txt | awk 'NR % 30 == 1' > out/compile/cut.txt
          $fd compile out/compile/cut.txt --store out/compile/atlas --size 128x72 --iter 100000 --workers 2 \
            | grep -v '^\(frame\|job\) ' | tee out/compile/compile.txt
          $fd manifest walk --store out/compile/atlas
      - name: independent-frame control (VIDE-03) along the valley path, every frame vs the oracle
        run: |
          set -euo pipefail
          mkdir -p out/control
          target/release/fd control bench/path-valley.txt --size 128x72 --iter 50000 --columns nu,de --threads 4 \
            --runs 2 -o out/control --oracle tools/oracle.py --k 4 | tee out/control/control.jsonl
      - name: stored BLA tables (ACC-01) along the valley path, vs plain iterations and the oracle
        run: |
          set -euo pipefail
          fd=target/release/fd; st=out/bla/atlas; mkdir -p out/bla
          common=(--re -0.743643887037158704752191506114774 --im 0.131825904205311970493132056385139 --size 128x72 --iter 50000 --columns nu,de --threads 4)
          orbit=$($fd orbit put --store $st "${common[@]}" --width 1e-28 | awk '$1=="orbit"{print $2}')
          echo "== shared table, built for the 1e-15 frame"
          shared=$($fd orbit bla --store $st "${common[@]}" --width 1e-15 --orbit "$orbit" | tee /dev/stderr | awk '$1=="bla"{print $2}')
          for w in 1e-15 1e-18 1e-21 1e-24 1e-28; do
            own=$($fd orbit bla --store $st "${common[@]}" --width "$w" --orbit "$orbit" | awk '$1=="bla"{print $2}')
            for t in "shared $shared" "own $own"; do
              read -r name id <<< "$t"
              echo "== width $w, $name table"
              $fd render "${common[@]}" --width "$w" --store $st --bla "$id" -o "out/bla/$w-$name.fds"
              python3 tools/oracle.py "out/bla/$w-$name.fds" --k 4
            done
            echo "== width $w, plain perturbation"
            $fd bench "${common[@]}" --width "$w" --runs 1 -o "out/bla/$w-plain.fds" | grep -o '"iterations":{[^}]*}'
            python3 tools/oracle.py "out/bla/$w-plain.fds" --k 4
          done
          echo "== shallow f64 frame (seahorse): no block is valid at |dc| ~ 4e-3, fallback 100%"
          sea=(--re -0.7453 --im 0.1127 --width 0.0065 --size 192x108 --iter 20000 --columns nu,de --threads 4)
          id=$($fd orbit bla --store $st "${sea[@]}" | tee /dev/stderr | awk '$1=="bla"{print $2}')
          $fd render "${sea[@]}" --store $st --bla "$id" -o out/bla/seahorse.fds
          python3 tools/oracle.py out/bla/seahorse.fds --k 8
          $fd chunk stats --store $st
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-results
          path: |
            out/locations/oracle.jsonl
            out/bench/bench.jsonl
            out/control/control.jsonl
