name: koenigs-bench
# PROB-08: manual timing of the all-double Koenigs deep-pixel pipeline against fd's
# per-frame BLA renderer and a lean perturbation baseline, on one runner, with every
# pixel scored against fd. Run with: gh workflow run koenigs-bench.yml
on:
  workflow_dispatch:
    inputs:
      mid:
        description: PROB-14 mid-band whole frames
        type: boolean
        default: false
      threads:
        description: render threads (same for every contestant)
        default: "4"
      runs:
        description: timed runs per frame (best is reported)
        default: "5"
      size:
        description: frame size NXxNY
        default: "480x270"
      degree:
        description: biseries degree of the loop map
        default: "4"
      guard:
        description: loop exit guard |z - C|
        default: "1e-28"
      terms:
        description: Koenigs series terms
        default: "12"
      psi:
        description: psi series terms (0 = Newton inverse)
        default: "0"
      patch:
        description: tail patch atlas max depth (0 = none)
        default: "0"

env:
  CARGO_TERM_COLOR: never

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.mid != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpmath gmpy2 numpy
      - run: cargo build --release -j 4
      - name: machine
        run: nproc && lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: timing and scoring
        run: |
          THREADS=${{ inputs.threads }} RUNS=${{ inputs.runs }} SIZE=${{ inputs.size }} \
            DEGREE=${{ inputs.degree }} GUARD=${{ inputs.guard }} TERMS=${{ inputs.terms }} PSI=${{ inputs.psi }} PATCH=${{ inputs.patch }} \
            bash tools/research/misiurewicz/koenigs_bench/run.sh target/release/fd out/koenigs
          cat out/koenigs/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: koenigs-bench
          path: |
            out/koenigs/report.md
            out/koenigs/*.jsonl
            out/koenigs/*-score.txt
            out/koenigs/consts.txt

  mid:
    if: inputs.mid == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mpmath gmpy2 numpy
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/research/misiurewicz/koenigs_bench/Cargo.toml
      - run: cargo clippy --manifest-path tools/research/misiurewicz/koenigs_bench/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --release -j 4
      - name: machine
        run: nproc && lscpu | grep -E 'Model name|^CPU\(s\)'
      - name: mid-band timing and scoring
        run: |
          THREADS=${{ inputs.threads || '4' }} RUNS=${{ inputs.runs || '3' }} SIZE=${{ inputs.size || '480x270' }} \
            bash tools/research/misiurewicz/koenigs_bench/run_mid.sh target/release/fd out/mid-band
          cat out/mid-band/score.jsonl >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mid-band
          path: |
            out/mid-band/*.jsonl
            out/mid-band/path.txt
